    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>

    <!-- Anti-debugging script -->
    <script>
      // Disable right-click menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
      
      // Disable keyboard shortcuts for developer tools
      document.addEventListener('keydown', function(e) {
        // F12 key
        if (e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        
        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        if (e.ctrlKey && 
            (e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67))) {
          e.preventDefault();
          return false;
        }
      });
      
      // Detection for console opening
      (function() {
        const devtoolsDetector = {
          isOpen: false,
          orientation: null
        };
        
        const threshold = 160;
        const emitEvent = function(isOpen, orientation) {
          window.dispatchEvent(new CustomEvent('devtoolschange', {
            detail: {
              isOpen: isOpen,
              orientation: orientation
            }
          }));
        };
        
        setInterval(function() {
          const widthThreshold = window.outerWidth - window.innerWidth > threshold;
          const heightThreshold = window.outerHeight - window.innerHeight > threshold;
          
          if (widthThreshold || heightThreshold) {
            if (!devtoolsDetector.isOpen) {
              devtoolsDetector.isOpen = true;
              devtoolsDetector.orientation = widthThreshold ? 'vertical' : 'horizontal';
              console.clear();
              console.log('%c⚠️ Warning: Developer Tools Detected', 'color: red; font-size: 30px; font-weight: bold;');
              console.log('%cThis is a secure application. Inspecting or modifying this code may violate applicable laws.', 'color: red; font-size: 16px;');
            }
          } else {
            if (devtoolsDetector.isOpen) {
              devtoolsDetector.isOpen = false;
              devtoolsDetector.orientation = null;
            }
          }
        }, 500);
      })();
    </script>
  </body>
